[project]
name = "web_world_builder"
version = "1.0.0"
description = "An application for world building towns."
dependencies = [
    "flask",
    "sqlalchemy"
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["web_world_builder"]